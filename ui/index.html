<!doctype html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReaderX</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="shelf-view">
    <header class="header">
      <h1>ReaderX</h1>
      <button id="change-folder" class="btn" type="button" hidden>Change folder</button>
    </header>
    <div id="notice" class="notice" role="status" hidden>
      <span id="notice-text"></span>
      <button id="notice-dismiss" class="btn" type="button">Dismiss</button>
    </div>
    <main id="shelf"></main>
  </div>

  <div id="reader-view" hidden>
    <header class="reader-bar">
      <button id="reader-back" class="btn" type="button">&larr; Back</button>
      <div id="reader-title" class="reader-title"></div>
      <button id="hl-toggle" class="btn" type="button" aria-expanded="false" aria-controls="hl-panel">Highlights (0)</button>
      <button id="toc-toggle" class="btn" type="button" aria-expanded="false" aria-controls="toc-panel" hidden>Contents</button>
      <div id="epub-flow" class="epub-flow" hidden>
        <button id="epub-smaller" class="btn" type="button" aria-label="Smaller text">A&minus;</button>
        <button id="epub-bigger" class="btn" type="button" aria-label="Bigger text">A+</button>
        <div class="theme-toggle" role="group" aria-label="Page layout">
          <button type="button" data-layout-choice="paginated" aria-pressed="true">Pages</button>
          <button type="button" data-layout-choice="scrolled" aria-pressed="false">Scroll</button>
        </div>
      </div>
      <div class="theme-toggle" role="group" aria-label="Page theme">
        <button type="button" data-theme-choice="original" aria-pressed="false">Original</button>
        <button type="button" data-theme-choice="paper" aria-pressed="false">Paper</button>
        <button type="button" data-theme-choice="night" aria-pressed="false">Night</button>
      </div>
    </header>
    <div id="viewer-host"></div>
    <aside id="hl-panel" class="hl-panel" aria-label="Highlights" hidden>
      <p id="hl-damaged" class="hl-damaged" hidden>Highlights for this book were damaged and set aside.</p>
      <div class="hl-scroll">
        <p id="hl-empty" class="hl-empty">Select text to highlight it.</p>
        <ul id="hl-list" class="hl-list"></ul>
      </div>
      <div id="hl-export" class="hl-export"></div>
    </aside>
    <div id="hl-bar"class="hl-bar" role="status" hidden>
      <span id="hl-bar-text"></span>
      <button id="hl-undo" class="hl-undo" type="button" hidden>Undo</button>
    </div>
  </div>
</body>
</html>
